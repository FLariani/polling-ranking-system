{% extends "base.html" %}
{% block title %}Create Session{% endblock %}

{% block content %}
<h1>Create a Session</h1>
<p class="subtitle">Configure how voters will participate, then launch the session.</p>

<form method="post" action="/admin/create">
  <!-- Session type -->
  <p style="font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:.75rem;">
    Session Type
  </p>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.75rem;">

    <label class="type-card" id="card-ranking">
      <input type="radio" name="session_type" value="ranking" checked hidden>
      <div class="type-card-check" id="check-ranking">&#10003;</div>
      <strong>Ranking</strong>
      <p>Voters order all items from best to worst. Results show average rank.</p>
    </label>

    <label class="type-card" id="card-voting">
      <input type="radio" name="session_type" value="voting" hidden>
      <div class="type-card-check" id="check-voting"></div>
      <strong>Voting</strong>
      <p>Voters pick one item. Results show vote counts.</p>
    </label>

  </div>

  <!-- Anonymous toggle -->
  <div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:1.25rem 1.75rem; margin-bottom:1.75rem;">
    <div>
      <strong>Anonymous Mode</strong>
      <p style="margin:0.2rem 0 0; color:var(--muted); font-size:.9rem;">
        When on, voters see no name field — all votes are recorded as Anonymous.
      </p>
    </div>
    <label class="toggle">
      <input type="checkbox" name="anonymous" id="anonymous-toggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </label>
  </div>

  <button class="btn btn-primary" type="submit" style="width:100%; padding:.75rem;">
    Launch Session
  </button>
</form>

<style>
  /* ── Type selection cards ── */
  .type-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .4rem;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    cursor: pointer;
    transition: border-color .15s;
  }
  .type-card:hover { border-color: var(--primary); }
  .type-card.selected { border-color: var(--primary); background: #f5f3ff; }
  .type-card strong { font-size: 1rem; }
  .type-card p { margin: 0; color: var(--muted); font-size: .875rem; line-height: 1.5; }

  .type-card-check {
    position: absolute;
    top: .75rem;
    right: .75rem;
    width: 1.25rem;
    height: 1.25rem;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    background: var(--surface);
    color: #fff;
    transition: background .15s, border-color .15s;
  }
  .type-card.selected .type-card-check {
    background: var(--primary);
    border-color: var(--primary);
  }

  /* ── Toggle switch ── */
  .toggle { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; margin-left: 1.5rem; }
  .toggle input { display: none; }
  .toggle-track {
    width: 46px;
    height: 26px;
    background: #d1d5db;
    border-radius: 999px;
    position: relative;
    transition: background .2s;
  }
  .toggle input:checked + .toggle-track { background: var(--primary); }
  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: left .2s;
  }
  .toggle input:checked + .toggle-track .toggle-thumb { left: 23px; }
</style>

<script>
  // Keep the type-card selected style in sync with the radio buttons.
  const cards = document.querySelectorAll('.type-card');
  function syncCards() {
    cards.forEach(card => {
      const radio = card.querySelector('input[type="radio"]');
      const check = card.querySelector('.type-card-check');
      if (radio.checked) {
        card.classList.add('selected');
        check.textContent = '✓';
      } else {
        card.classList.remove('selected');
        check.textContent = '';
      }
    });
  }
  cards.forEach(card => card.addEventListener('click', syncCards));
  syncCards();
</script>
{% endblock %}
